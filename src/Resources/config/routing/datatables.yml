# src/Resources/config/routing/datatables.yml
wbw_datatables_delete:
    path: "/datatables/{name}/delete/{id}"
    defaults: { _controller: "WBW\\Bundle\\DataTablesBundle\\Controller\\DeleteDataTablesController::deleteAction" }
    methods: [ "GET" ]

wbw_datatables_edit:
    path: "/datatables/{name}/edit/{id}/{data}/{value}"
    defaults: { _controller: "WBW\\Bundle\\DataTablesBundle\\Controller\\DefaultDataTablesController::editAction", value: null }
    methods: [ "GET", "POST" ]

wbw_datatables_export:
    path: "/datatables/{name}/export"
    defaults: { _controller: "WBW\\Bundle\\DataTablesBundle\\Controller\\ExportDataTablesController::exportAction" }
    methods: [ "GET", "POST" ]

wbw_datatables_index:
    path: "/datatables/{name}/index"
    defaults: { _controller: "WBW\\Bundle\\DataTablesBundle\\Controller\\ReadDataTablesController::indexAction" }
    methods: [ "GET", "POST" ]

wbw_datatables_options:
    path: "/datatables/{name}/options"
    defaults: { _controller: "WBW\\Bundle\\DataTablesBundle\\Controller\\DefaultDataTablesController::optionsAction" }
    methods: [ "GET" ]

wbw_datatables_render:
    path: "/datatables/{name}/render/{alone}"
    defaults: { _controller: "WBW\\Bundle\\DataTablesBundle\\Controller\\DefaultDataTablesController::renderAction", alone: null }
    methods: [ "GET" ]

wbw_datatables_serialize:
    path: "/datatables/{name}/serialize/{id}"
    defaults: { _controller: "WBW\\Bundle\\DataTablesBundle\\Controller\\ReadDataTablesController::serializeAction" }
    methods: [ "GET" ]

wbw_datatables_show:
    path: "/datatables/{name}/show/{id}"
    defaults: { _controller: "WBW\\Bundle\\DataTablesBundle\\Controller\\ReadDataTablesController::serializeAction" }
    methods: [ "GET" ]
